version: "3.8"

services:
  test:
    build:
      context: .
      dockerfile: app/Dockerfile
    volumes:
      - ./app:/app
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROK_API_KEY: ${GROK_API_KEY}
    command: pytest /app/tests/test_review_service.py -v
    networks:
      - dev-daodao-network
