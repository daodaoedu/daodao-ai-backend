name: Continuous Delivery

# ===== 並發控制設定 =====
# 目的：防止同一分支的多個部署同時執行
# group: 使用 workflow 名稱和 ref 建立唯一群組識別
# cancel-in-progress: 當有新的部署時，自動取消進行中的舊部署
# 這樣可以確保只有最新的代碼被部署到伺服器
# =======================
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ===== 觸發條件設定 =====
# 1. push 事件：當代碼推送到 main 或 dev 分支時自動觸發
#    - main 分支：部署到生產環境
#    - dev 分支：部署到開發環境
# 2. workflow_dispatch：提供手動觸發選項
#    - force_deploy：允許跳過 CI 檢查直接部署（緊急修復時使用）
# =======================
on:
  # push:
  #   branches:
  #     - main
  #     - dev
  # test
  pull_request:
    branches:
      - dev
  # 手動觸發部署
  workflow_dispatch:



jobs:
  # ===== 持續整合 (CI) 階段 =====
  # 目的：在部署前執行程式碼品質檢查
  # 執行條件：
  #   - 只在 push 事件時執行（確保程式碼品質）
  #   - 手動部署且啟用 force_deploy 時跳過（緊急部署）
  # 內容：呼叫 continuous-integration.yml 執行測試、linting 等
  # secrets: inherit 確保子工作流程可以存取相同的 secrets
  # ==============================
  continuous_integration:
    if: ${{ github.event_name == 'push' && !inputs.force_deploy }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ===== Docker 映像構建階段 =====
  # 目的：構建應用程式的 Docker 映像並推送到 Docker Hub
  # 執行條件：
  #   - CI 成功完成
  #   - 或手動觸發且啟用 force_deploy
  #   - 或 CI 被跳過（例如直接手動部署）
  # 輸出：
  #   - image-tag：環境標籤（prod/dev）供後續步驟使用
  #   - image-digest：映像摘要用於驗證
  # ===============================
  build:
    runs-on: ubuntu-latest
    needs: [continuous_integration]
    # 當 CI 成功、手動強制部署、或沒有執行 CI 時執行
    if: ${{ always() && (needs.continuous_integration.result == 'success' || inputs.force_deploy || needs.continuous_integration.result == 'skipped') }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Environment Variables
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "CACHE_TAG=prod" >> $GITHUB_ENV
            echo "image-tag=prod" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "CACHE_TAG=dev" >> $GITHUB_ENV
            echo "image-tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ===== 檢測類型變更 =====
      # 檢查本次 commit 是否涉及類型文件變更
      # 如果有類型變更，禁用快取確保正確重建
      # ==============================
      - name: Check Python code changes
        id: python_changes
        run: |
          if git diff --name-only ${{ github.event.before }}..${{ github.sha }} | grep -E "pyproject\.toml|uv\.lock|src/"; then
            echo "python_changed=true" >> $GITHUB_OUTPUT
            echo "🔄 Python files changed, will build without cache"
          else
            echo "python_changed=false" >> $GITHUB_OUTPUT
            echo "✅ No Python code changes, can use cache"
          fi

      # ===== Docker 映像構建與推送 =====
      # 智慧快取策略說明：
      # 1. Registry 快取：從當前環境的最新映像讀取（最可能命中相同依賴層）
      # 2. BuildCache：從專用快取映像讀取（保存完整構建快取）
      # 3. GitHub Actions：從本地快取讀取（速度最快）
      # 4. 類型檢測：類型文件變更時禁用快取
      #
      # 快取輸出策略：
      # 1. 專用快取映像：跨 runner 共享，持久化
      # 2. GitHub Actions 快取：同一 runner 快速存取
      # 3. 內聯快取：由 BUILDKIT_INLINE_CACHE=1 自動處理
      # ================================
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 智慧快取控制：只有類型變更時才禁用快取
          no-cache: ${{ steps.python_changes.outputs.python_changed == 'true' }}
          # 建立兩個標籤：環境標籤和特定 commit 標籤
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/src:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/src:${{ env.IMAGE_TAG }}-${{ github.sha }}
          # 多層快取策略（只有在使用快取時生效）
          cache-from: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/src:${{ env.CACHE_TAG }}
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/src:buildcache-${{ env.CACHE_TAG }}
            type=gha
          cache-to: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/src:buildcache-${{ env.CACHE_TAG }},mode=max
            type=gha,mode=max
          build-args: |
            APP_ENV=${{ env.APP_ENV }}
            BUILDKIT_INLINE_CACHE=1
          platforms: linux/amd64

      # ===== 構建驗證 =====
      # 驗證構建的 Docker 映像是否正常運行
