name: Deploy to Linode (FastAPI)

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Step 1: 測試階段
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Lint and type check
        run: |
          pip install black mypy
          black --check app
          mypy app

      - name: Run tests
        run: |
          pip install pytest
          pytest -v

  # Step 2: 部署階段
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Set Environment Variables
        run: |
          echo "APP_DIR=/root/daodao-ai-backend" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yaml" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "APP_SERVICE=backend-prod" >> $GITHUB_ENV
            echo "APP_PORT=8000" >> $GITHUB_ENV
          else
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "APP_SERVICE=backend-dev" >> $GITHUB_ENV
            echo "APP_PORT=8002" >> $GITHUB_ENV
          fi

      - name: Deploy to Linode
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          GIT_HUB_USERNAME: ${{ secrets.GIT_HUB_USERNAME }}
          GIT_HUB_ACCESS_TOKEN: ${{ secrets.GIT_HUB_ACCESS_TOKEN }}
        run: |
          ssh root@$LINODE_INSTANCE_IP "
            set -e
            export APP_DIR=${{ env.APP_DIR }}
            export APP_ENV=${{ env.APP_ENV }}
            export APP_SERVICE=${{ env.APP_SERVICE }}
            export COMPOSE_FILE=${{ env.COMPOSE_FILE }}

            echo '📦 Starting deployment for' \$APP_ENV

            # 初始化專案資料夾
            mkdir -p \$APP_DIR
            cd \$APP_DIR

            # 若已存在 repo 則更新，否則 clone
            if [ -d .git ]; then
              echo '🔄 Updating existing repository...'
              git fetch --all
              git checkout ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
            else
              echo '🆕 Cloning repository...'
              git clone https://${{ env.GIT_HUB_USERNAME }}:${{ env.GIT_HUB_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git .
              git checkout ${{ github.ref_name }}
            fi

            # 檢查環境變數檔
            if [ ! -f .env.\${APP_ENV} ]; then
              echo '⚠️ No .env.\${APP_ENV} found, copying template...'
              cp .env.\${APP_ENV}_template .env.\${APP_ENV} || true
            fi

            # 啟動 Docker Compose
            echo '🚀 Building and starting docker-compose for' \$APP_SERVICE
            docker compose --env-file .env.\${APP_ENV} -f \$COMPOSE_FILE down
            docker compose --env-file .env.\${APP_ENV} -f \$COMPOSE_FILE build --no-cache \$APP_SERVICE
            docker compose --env-file .env.\${APP_ENV} -f \$COMPOSE_FILE up -d --no-deps \$APP_SERVICE

          "

  # Step 3: 驗證部署階段
  verify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Verify Deployment Health
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            APP_PORT=8000
          else
            APP_PORT=8002
          fi
          echo "🔍 Checking FastAPI health endpoint on port $APP_PORT ..."
          ssh root@$LINODE_INSTANCE_IP "
            curl -f http://localhost:\$APP_PORT/api/v1/health || (echo '❌ Health check failed' && exit 1)
            echo '✅ Health check passed on port '\$APP_PORT
          "

  # Step 4: Discord 通知階段
  notify:
    needs: [test, verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Discord Notification
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            STATUS_MSG="🚨 FastAPI 測試階段失敗！"
            COLOR=16711680
          elif [ "${{ needs.verify.result }}" == "failure" ]; then
            STATUS_MSG="🚨 FastAPI 部署驗證失敗！"
            COLOR=16711680
          else
            STATUS_MSG="✅ FastAPI ${GITHUB_REF##*/} 環境部署成功！🎉"
            COLOR=3066993
          fi

          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"$STATUS_MSG\", \"embeds\": [{\"title\": \"Deploy to Linode (FastAPI)\", \"color\": $COLOR}]}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
