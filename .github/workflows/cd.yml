name: Continuous Delivery

# ===== 並發控制設定 =====
# 目的：防止同一分支的多個部署同時執行
# group: 使用 workflow 名稱和 ref 建立唯一群組識別
# cancel-in-progress: 當有新的部署時，自動取消進行中的舊部署
# 這樣可以確保只有最新的代碼被部署到伺服器
# =======================
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ===== 觸發條件設定 =====
# 1. push 事件：當代碼推送到 main 或 dev 分支時自動觸發
#    - main 分支：部署到生產環境
#    - dev 分支：部署到開發環境
# 2. workflow_dispatch：提供手動觸發選項
#    - force_deploy：允許跳過 CI 檢查直接部署（緊急修復時使用）
# =======================
on:
  push:
    branches:
      - main
      - dev
  # 手動觸發部署
  workflow_dispatch:



jobs:
  # ===== 持續整合 (CI) 階段 =====
  # 目的：在部署前執行程式碼品質檢查
  # 執行條件：
  #   - 只在 push 事件時執行（確保程式碼品質）
  #   - 手動部署且啟用 force_deploy 時跳過（緊急部署）
  # 內容：呼叫 continuous-integration.yml 執行測試、linting 等
  # secrets: inherit 確保子工作流程可以存取相同的 secrets
  # ==============================
  continuous_integration:
    if: ${{ github.event_name == 'push' && !inputs.force_deploy }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ===== Docker 映像構建階段 =====
  # 目的：構建應用程式的 Docker 映像並推送到 Docker Hub
  # 執行條件：
  #   - CI 成功完成
  #   - 或手動觸發且啟用 force_deploy
  #   - 或 CI 被跳過（例如直接手動部署）
  # 輸出：
  #   - image-tag：環境標籤（prod/dev）供後續步驟使用

  # ===============================
  build:
    runs-on: ubuntu-latest
    needs: [continuous_integration]
    # 當 CI 成功、手動強制部署、或沒有執行 CI 時執行
    if: ${{ always() && (needs.continuous_integration.result == 'success' || inputs.force_deploy || needs.continuous_integration.result == 'skipped') }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Set Environment Variables
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "CACHE_TAG=prod" >> $GITHUB_ENV
            echo "image-tag=prod" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "CACHE_TAG=dev" >> $GITHUB_ENV
            echo "image-tag=dev" >> $GITHUB_OUTPUT
          fi
      - name: Dummy Build Step
        run: |
          echo "執行 build 任務"
          echo "Build completed successfully"
  deploy:
    env:
      APP_DIR: /root/daodao-ai-backend

    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    environment: ${{ needs.build.outputs.image-tag == 'prod' && 'production' || 'development' }}
    timeout-minutes: 15
    steps:
      - name: Show build result
        run: |
          echo "Build job result: ${{ needs.build.result }}"
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts
      - name: Set COMPOSE_FILE
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "COMPOSE_FILE=docker-compose.prod.yml" >> $GITHUB_ENV
          else
            echo "COMPOSE_FILE=docker-compose.dev.yml" >> $GITHUB_ENV
          fi

      - name: Deploy to Linode
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          src_ENV: ${{ needs.build.outputs.image-tag }}
          src_SERVICE: ${{ needs.build.outputs.image-tag == 'prod' && 'prod_src' || 'dev_src' }}
          COMMIT_SHA: ${{ github.sha }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=10 root@$LINODE_INSTANCE_IP << 'ENDSSH'
            set -e
            export src_DIR=${{ env.APP_DIR }}
            export COMPOSE_FILE=${{ env.COMPOSE_FILE }}
            export src_ENV=${{ env.src_ENV }}
            export src_SERVICE=${{ env.src_SERVICE }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export COMMIT_SHA=${{ env.COMMIT_SHA }}
            export BRANCH_NAME=${{ env.BRANCH_NAME }}

            echo "=== Starting deployment for $src_ENV environment ==="

            # 快速更新代碼（淺層克隆或增量更新）
            if [ -d $src_DIR/.git ]; then
              cd $src_DIR
              echo "Updating existing repository..."
              # 只獲取最新的變更
              git fetch --depth 1 origin ${{ env.BRANCH_NAME }}
              git reset --hard FETCH_HEAD
              git clean -fd
            else
              echo "Cloning repository..."
              # 淺層克隆
              git clone --depth 1 --branch ${{ env.BRANCH_NAME }} \
                https://${{ secrets.GIT_HUB_USERNAME }}:${{ secrets.GIT_HUB_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git \
                $src_DIR
              cd $src_DIR
            fi

            # 檢查環境文件
            ENV_FILE=".env.${src_ENV}"

            if [ ! -f .env.${src_ENV} ] && [ -f .env.${src_ENV}.sample ]; then
              cp ".env.${src_ENV}.sample" "$ENV_FILE"
              echo "Created $ENV_FILE from .sample"
            fi

            # ── 強制刷新 Secrets ──
            # 用 sed 原地替換：key 存在則更新值，不存在則 append
            # 避免重複 key（原始 placeholder + CD 注入真實值）
            set_env_var() {
              local key="$1"
              local value="$2"
              # 用 | 作為 sed 分隔符，避免 value 含 / 時出錯
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
              else
                echo "${key}=${value}" >> "$ENV_FILE"
              fi
            }

            set_env_var "JWT_SECURITY"                    "${{ secrets.JWT_SECURITY }}"
            set_env_var "COLLECTION_NAME"                 "${{ secrets.COLLECTION_NAME }}"
            set_env_var "POSTGRES_DB_USER"                "${{ secrets.POSTGRES_DB_USER }}"
            set_env_var "POSTGRES_DB_PASSWORD"            "${{ secrets.POSTGRES_DB_PASSWORD }}"
            set_env_var "POSTGRES_DB_NAME"                "${{ secrets.POSTGRES_DB_NAME }}"
            set_env_var "API_SECRET_KEY"                  "${{ secrets.API_SECRET_KEY }}"
            set_env_var "LLM_BACKEND__OPENAI__API_KEY"    "${{ secrets.LLM_BACKEND__OPENAI__API_KEY }}"
            set_env_var "LLM_BACKEND__GEMINI__API_KEY"    "${{ secrets.LLM_BACKEND__GEMINI__API_KEY }}"
            set_env_var "LLM_BACKEND__ANTHROPIC__API_KEY" "${{ secrets.LLM_BACKEND__ANTHROPIC__API_KEY }}"
            set_env_var "LLM_BACKEND__GROQ__API_KEY"      "${{ secrets.LLM_BACKEND__GROQ__API_KEY }}"
            set_env_var "INSIGHT__LLM_BACKEND"            "${{ secrets.INSIGHT__LLM_BACKEND }}"
            set_env_var "INSIGHT__SCHEDULE_CRON"          "${{ secrets.INSIGHT__SCHEDULE_CRON }}"

            echo "✅ Generated $ENV_FILE with latest GitHub Secrets"

            # ===== 清理舊容器 =====
            echo "=== Cleaning up old containers for $src_ENV ==="
            # 停止並移除所有相關舊容器
            if make down-${src_ENV}; then
                echo "✅ Old containers cleaned up"
            else
                echo "⚠️ No old containers found or cleanup failed, continuing..."
            fi

            # 強制移除舊 image（加 -f 避免被執行中容器擋住）
            docker rmi -f daodao-ai-backend:${IMAGE_TAG} 2>/dev/null || true
            echo "✅ Cleaned up old daodao-ai-backend:${IMAGE_TAG} image"

            sleep 3

            # 啟動新容器
            if make up-${src_ENV}; then
                echo "✅ New image build and container started, verifying health..."
            else
                echo "❌ Failed to start new container"
                echo "=== Checking container logs ==="
                docker compose -f $COMPOSE_FILE --profile ${src_ENV} logs --tail=100 backend-${src_ENV} || true
                echo "Container status:"
                docker ps -a --filter "name=backend-${src_ENV}" || true
                exit 1
            fi


            # ===== 健康檢查 =====
            # 用 docker compose ps -q 取 container ID，再用 docker exec 直接呼叫
            # 避免 docker compose exec 因 --profile 未指定導致找不到 service 的問題
            service_name="backend-${src_ENV}"
            HEALTH_URL="http://localhost:${BACKEND_PORT:-8000}/api/v1/health"
            MAX_ATTEMPTS=24
            SLEEP_SECONDS=5

            for i in $(seq 1 $MAX_ATTEMPTS); do
                echo "Waiting ${SLEEP_SECONDS}s before attempt $i/$MAX_ATTEMPTS..."
                sleep $SLEEP_SECONDS

                # 取得 container ID（若容器未啟動則為空）
                container_id=$(docker compose -f $COMPOSE_FILE --profile ${src_ENV} ps -q $service_name 2>/dev/null)

                if [ -z "$container_id" ]; then
                    echo "⚠ Attempt $i/$MAX_ATTEMPTS: container not running"
                    status="error"
                else
                    status=$(docker exec "$container_id" python3 -c "import json,urllib.request; print(json.load(urllib.request.urlopen('$HEALTH_URL')).get('status','error'))" 2>&1) || status="error"
                fi

                if [ "$status" = "ok" ]; then
                    echo "✅ $service_name status OK"
                    break
                else
                    echo "⚠ Attempt $i/$MAX_ATTEMPTS: $service_name status NOT OK (status: $status)"
                    if [ $i -eq $MAX_ATTEMPTS ]; then
                        echo "❌ $service_name failed health check after $MAX_ATTEMPTS attempts"
                        echo "=== Container Logs ==="
                        docker compose -f $COMPOSE_FILE --profile ${src_ENV} logs --tail=100 $service_name || true
                        exit 1
                    fi
                fi
            done

            echo "=== Checking Docker Containers ==="
            docker ps -a --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            echo "=== Checking Docker Images ==="
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}\t{{.CreatedAt}}"

            echo "=== Checking System Resources ==="
            echo "CPU Load:" && uptime
            echo "Memory Usage:" && free -h
            echo "Disk Usage:" && df -h /

          ENDSSH
      - name: Verify Deployment
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}

        run: |
          ssh root@$LINODE_INSTANCE_IP /bin/bash << 'EOF'
            echo '=== Checking Docker Containers ==='
            docker ps

            echo '=== Checking System Resources ==='
            echo 'CPU Load:' && uptime
            echo 'Memory Usage:' && free -h
            echo 'Disk Usage:' && df -h /

            echo '=== Checking Docker Networks ==='
            docker network ls
          EOF

  # ===== Discord 通知系統 =====
  # 目的：向團隊報告部署結果
  # 執行條件：always() - 無論成功或失敗都執行
  # ============================
  notify:
    runs-on: ubuntu-latest
    needs: [continuous_integration, build, deploy]
    if: always()
    steps:
      - name: Send Discord Notification
        run: |
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          CI_STATUS="${{ needs.continuous_integration.result }}"
          BUILD_STATUS="${{ needs.build.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"

          if [ "$CI_STATUS" = "failure" ]; then
            COLOR=16711680
            TITLE="❌ CI Failed"
          elif [ "$BUILD_STATUS" = "failure" ]; then
            COLOR=16711680
            TITLE="❌ Build Failed"
          elif [ "$DEPLOY_STATUS" = "failure" ]; then
            COLOR=16711680
            TITLE="❌ Deploy Failed"
          elif [ "$DEPLOY_STATUS" = "cancelled" ]; then
            COLOR=8421504
            TITLE="⚠️ Deploy Cancelled"
          elif [ "$DEPLOY_STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Deploy Success ($IMAGE_TAG)"
          else
            COLOR=16776960
            TITLE="❓ Unknown Status"
          fi

          WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠ DISCORD_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Repo\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                  {\"name\": \"Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" "$WEBHOOK_URL")

          if [ "$HTTP_STATUS" != "204" ]; then
            echo "⚠ Discord notification failed (HTTP $HTTP_STATUS)"
          else
            echo "✅ Discord notification sent"
          fi
