name: Continuous Delivery

# ===== 並發控制設定 =====
# 目的：防止同一分支的多個部署同時執行
# group: 使用 workflow 名稱和 ref 建立唯一群組識別
# cancel-in-progress: 當有新的部署時，自動取消進行中的舊部署
# 這樣可以確保只有最新的代碼被部署到伺服器
# =======================
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ===== 觸發條件設定 =====
# 1. push 事件：當代碼推送到 main 或 dev 分支時自動觸發
#    - main 分支：部署到生產環境
#    - dev 分支：部署到開發環境
# 2. workflow_dispatch：提供手動觸發選項
#    - force_deploy：允許跳過 CI 檢查直接部署（緊急修復時使用）
# =======================
on:
  # push:
  #   branches:
  #     - main
  #     - dev
  # test
  pull_request:
    branches:
      - dev
  # 手動觸發部署
  workflow_dispatch:



jobs:
  # ===== 持續整合 (CI) 階段 =====
  # 目的：在部署前執行程式碼品質檢查
  # 執行條件：
  #   - 只在 push 事件時執行（確保程式碼品質）
  #   - 手動部署且啟用 force_deploy 時跳過（緊急部署）
  # 內容：呼叫 continuous-integration.yml 執行測試、linting 等
  # secrets: inherit 確保子工作流程可以存取相同的 secrets
  # ==============================
  continuous_integration:
    if: ${{ github.event_name == 'push' && !inputs.force_deploy }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ===== Docker 映像構建階段 =====
  # 目的：構建應用程式的 Docker 映像並推送到 Docker Hub
  # 執行條件：
  #   - CI 成功完成
  #   - 或手動觸發且啟用 force_deploy
  #   - 或 CI 被跳過（例如直接手動部署）
  # 輸出：
  #   - image-tag：環境標籤（prod/dev）供後續步驟使用

  # ===============================
  build:
    runs-on: ubuntu-latest
    needs: [continuous_integration]
    # 當 CI 成功、手動強制部署、或沒有執行 CI 時執行
    if: ${{ always() && (needs.continuous_integration.result == 'success' || inputs.force_deploy || needs.continuous_integration.result == 'skipped') }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Set Environment Variables
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "CACHE_TAG=prod" >> $GITHUB_ENV
            echo "image-tag=prod" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "CACHE_TAG=dev" >> $GITHUB_ENV
            echo "image-tag=dev" >> $GITHUB_OUTPUT
          fi
      - name: Dummy Build Step
        run: |
          echo "執行 build 任務"
          echo "Build completed successfully"
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ needs.build.result == 'success' }}
    environment: ${{ needs.build.outputs.image-tag == 'prod' && 'production' || 'development' }}
    timeout-minutes: 15
    steps:
      - name: Show build result
        run: |
          echo "Build job result: ${{ needs.build.result }}"
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts
      - name: Set COMPOSE_FILE
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "COMPOSE_FILE=docker-compose.prod.yaml" >> $GITHUB_ENV
          else
            echo "COMPOSE_FILE=docker-compose.dev.yaml" >> $GITHUB_ENV
          fi

      - name: Deploy to Linode
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          src_ENV: ${{ needs.build.outputs.image-tag }}
          src_SERVICE: ${{ needs.build.outputs.image-tag == 'prod' && 'prod_src' || 'dev_src' }}
          COMMIT_SHA: ${{ github.sha }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
