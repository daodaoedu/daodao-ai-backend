name: Continuous Integration

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acl_test
          POSTGRES_PASSWORD: acl_test
          POSTGRES_DB: daodao_acl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acl_test -d daodao_acl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.9.27
          uv sync --frozen --python 3.12

      - name: Run all unit tests
        run: make test

      - name: Run real PostgreSQL feed permission regressions
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://acl_test:acl_test@127.0.0.1:5432/daodao_acl_test
        run: .venv/bin/python3.12 -m pytest integration_tests/__tests__/test_private_cohort_feed_postgres.py -v

  format:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install black==25.9 ruff==0.14.1 bandit==1.8.6

      - name: Format check
        run: |
          python -m black --check src
          python -m ruff check src

      - name: Security scan
        run: python -m bandit -r src || true
