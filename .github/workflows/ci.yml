name: Continuous Integration

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_call:
  workflow_dispatch:

jobs:
  format:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install black==25.9 ruff==0.14.1 bandit==1.8.6

      - name: Format check
        run: |
          python -m black --check src
          python -m ruff check src

      - name: Security scan
        run: python -m bandit -r src || true
