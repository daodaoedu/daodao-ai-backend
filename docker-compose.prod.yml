networks:
  prod-daodao-network:
    external: true

services:
  backend-prod:
    build: ./app
    container_name: daodao-ai-backend-prod
    image: daodao-ai-backend-prod
    ports:
      - "8001:8000"
    networks:
      - prod-daodao-network
    profiles:
      - prod
    env_file:
      - .env.prod

  redis-prod:
    image: redis:alpine
    container_name: daodao-ai-redis-prod
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ./cache/prod_data:/data
    networks:
      - prod-daodao-network
    profiles:
      - prod
