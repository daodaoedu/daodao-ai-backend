networks:
  prod-daodao-network:
    external: true

services:
  backend-prod:
    build: .
    image: daodao-ai-backend:prod
    restart: unless-stopped
    depends_on:
      redis-prod:
        condition: service_healthy
    # ports:
    #   - "8001:8000"
    networks:
      prod-daodao-network:
        aliases:
          - backend-prod
    profiles:
      - prod
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env.prod
    # volumes:
    #   - ./src:/src

  redis-prod:
    image: redis:alpine
    container_name: daodao-ai-redis-prod
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be configured}
    command: ["sh", "-c", 'exec redis-server --requirepass "$${REDIS_PASSWORD}"']
    # ports:
    #   - "6380:6379"
    volumes:
      - ./cache_data/prod_data:/data
    networks:
      - prod-daodao-network
    profiles:
      - prod
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
