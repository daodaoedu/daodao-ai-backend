networks:
  prod-daodao-network:
    external: true

services:
  backend-prod:
    build: ./app
    container_name: daodao-ai-backend-prod
    image: daodao-ai-backend:latest
    # ports:
    #   - "8001:8000"
    networks:
      - prod-daodao-network
    profiles:
      - prod
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env.prod
    volumes:
      - ./app:/app

  redis-prod:
    image: redis:alpine
    container_name: daodao-ai-redis-prod
    restart: unless-stopped
    # ports:
    #   - "6380:6379"
    volumes:
      - ./cache_data/prod_data:/data
    networks:
      - prod-daodao-network
    profiles:
      - prod
