version: '3.8'

services:
  backend:
    build: ./app
    container_name: daodao-ai-backend-container
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}  # 使用環境變數
      OLLAMA_API_URL: ${OLLAMA_API_URL}  # 使用環境變數
      OPENAI_API_KEY: "your_openai_api_key_here"  # 直接設定環境變數
    networks:
      - shared-daodao-network
networks:
  shared-daodao-network:
    external: true
