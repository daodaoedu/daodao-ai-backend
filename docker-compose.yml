version: '3.8'

services:
  backend:
    build: ./app
    container_name: daodao-ai-backend-container
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}  # 使用環境變數
      # OLLAMA_API_URL: ${OLLAMA_API_URL}  # 使用環境變數
      OPENAI_API_KEY: ${OPENAI_API_KEY}  # 使用環境變數
      GEMINI_API_KEY: ${GEMINI_API_KEY}  # 使用環境變數
      GROK_API_KEY: ${GROK_API_KEY}  # 使用環境變數
    networks:
      - shared-daodao-network

  ollama:
    image: ollama/ollama
    container_name: daodao-ai-engine
    ports:
      - "11434:11434"  # 假設 ollama 服務監聽在 8080 端口
    networks:
      - shared-daodao-network
networks:
  shared-daodao-network:
    external: true
