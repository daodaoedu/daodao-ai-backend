networks:
  dev-daodao-network:
    external: true

services:
  backend-dev:
    build: .
    image: daodao-ai-backend:dev
    restart: unless-stopped
    depends_on:
      redis-dev:
        condition: service_healthy
    ports:
      - "8002:8000"
    networks:
      dev-daodao-network:
        aliases:
          - backend-dev
    profiles:
      - dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir src
      --reload-include "*.py"
      --workers 1
      --timeout-keep-alive 75

  redis-dev:
    image: redis:alpine
    container_name: daodao-ai-redis-dev
    restart: unless-stopped
    # ports:
    #   - "6381:6379"
    volumes:
      - ./cache_data/dev_data:/data
    networks:
      - dev-daodao-network
    profiles:
      - dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  ollama-dev:
    image: ollama/ollama
    container_name: daodao-ai-backend-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_models:/root/.ollama
    networks:
      - dev-daodao-network
    restart: unless-stopped
    profiles:
      - ollama
