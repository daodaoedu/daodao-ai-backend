networks:
  dev-daodao-network:
    external: true

services:
  backend-dev:
    build: .
    container_name: daodao-ai-backend-dev
    image: daodao-ai-backend:latest
    # ports:
    #   - "8002:8000"
    networks:
      - dev-daodao-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src

  redis-dev:
    image: redis:alpine
    container_name: daodao-ai-redis-dev
    restart: unless-stopped
    # ports:
    #   - "6381:6379"
    volumes:
      - ./cache_data/dev_data:/data
    networks:
      - dev-daodao-network
    profiles:
      - dev

