  # # Redis for cache & Celery broker
  redis-dev:
    image: redis:alpine
    container_name: daodao-ai-redis-dev
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - ./cache/dev_data:/data
    networks:
      - dev-daodao-network
    profiles:
      - dev

